name: Copilot development setup
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
      - 'tools/agent-context/**'
      - '.agents/skills/**'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '**/package.json'
      - 'package-lock.json'
      - '**/tsconfig*.json'
  # Validate the current index inputs after every merged change.
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '>=22.12.0 <23'
      - name: Install locked development dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check navigation tool
        run: node --test tools/agent-context/index.test.mjs
      - name: Prepare local navigation index
        run: node tools/agent-context/index.mjs build
