name: Isolated preview and beta release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected isolated stack to operate
        required: true
        type: choice
        options: [preview, beta]
      revision:
        description: Full immutable main commit SHA
        required: true
        type: string
      operation:
        description: Park a private API, rehearse restricted ingress, or roll back to the recorded known-good release
        required: true
        type: choice
        options: [park, rehearse, rollback]

permissions:
  contents: read
  actions: read

concurrency:
  group: isolated-release-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/main' && inputs.target == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: tocyn-preview
    env:
      TOCYN_OPERATION: ${{ inputs.operation }}
      TOCYN_RELEASE_TARGET: preview
      TOCYN_RELEASE_MODE: ${{ inputs.operation == 'park' && 'park' || 'rehearse' }}
      TOCYN_REVISION: ${{ inputs.revision }}
      TOCYN_RELEASE_DIR: ${{ runner.temp }}/tocyn-release
      TOCYN_D1_DATABASE_ID: ${{ vars.TOCYN_D1_DATABASE_ID }}
      TOCYN_D1_DATABASE_NAME: tocyn-preview-db
      TOCYN_ATTACHMENTS_BUCKET: tocyn-preview-attachments
      TOCYN_PORTAL_ORIGIN: ${{ vars.TOCYN_PORTAL_ORIGIN }}
      TOCYN_DASHBOARD_ORIGIN: ${{ vars.TOCYN_DASHBOARD_ORIGIN }}
      TOCYN_API_ORIGIN: ${{ vars.TOCYN_API_ORIGIN }}
      TOCYN_RESTRICTED_INGRESS_APPROVED: ${{ vars.TOCYN_RESTRICTED_INGRESS_APPROVED }}
      TOCYN_CLOUDFLARE_ACCOUNT_ID: ${{ vars.TOCYN_CLOUDFLARE_ACCOUNT_ID }}
      TOCYN_API_ACCESS_APPLICATION_ID: ${{ vars.TOCYN_API_ACCESS_APPLICATION_ID }}
      TOCYN_PORTAL_ACCESS_APPLICATION_ID: ${{ vars.TOCYN_PORTAL_ACCESS_APPLICATION_ID }}
      TOCYN_DASHBOARD_ACCESS_APPLICATION_ID: ${{ vars.TOCYN_DASHBOARD_ACCESS_APPLICATION_ID }}
      TOCYN_PORTAL_PAGES_ALIAS_ACCESS_APPLICATION_IDS: ${{ vars.TOCYN_PORTAL_PAGES_ALIAS_ACCESS_APPLICATION_IDS }}
      TOCYN_DASHBOARD_PAGES_ALIAS_ACCESS_APPLICATION_IDS: ${{ vars.TOCYN_DASHBOARD_PAGES_ALIAS_ACCESS_APPLICATION_IDS }}
      TOCYN_KNOWN_GOOD_REVISION: ${{ vars.TOCYN_KNOWN_GOOD_REVISION }}
      TOCYN_KNOWN_GOOD_RELEASE_DIGEST: ${{ vars.TOCYN_KNOWN_GOOD_RELEASE_DIGEST }}
      TOCYN_KNOWN_GOOD_ARTIFACT_RUN_ID: ${{ vars.TOCYN_KNOWN_GOOD_ARTIFACT_RUN_ID }}
      VITE_API_URL: ${{ vars.TOCYN_API_ORIGIN }}
    steps:
      - name: Check out trusted main workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '>=22.12.0 <23'
          cache: npm
      - name: Prove and check out the trusted release revision
        run: node scripts/deployment/verify-trusted-revision.mjs
      - name: Bind rollback input to the recorded known-good revision
        if: env.TOCYN_OPERATION == 'rollback'
        run: test "$TOCYN_REVISION" = "$TOCYN_KNOWN_GOOD_REVISION"
      - name: Install locked dependencies
        if: env.TOCYN_OPERATION != 'rollback'
        run: npm ci
      - name: Prepare the isolated release configuration
        if: env.TOCYN_OPERATION != 'rollback'
        run: node scripts/deployment/isolated-release.mjs prepare --target preview --revision "$TOCYN_REVISION" --mode "$TOCYN_RELEASE_MODE" --output "$TOCYN_RELEASE_DIR"
      - name: Run affected checks and build the release inputs
        if: env.TOCYN_OPERATION != 'rollback'
        run: |
          npm run lint --workspace=apps/portal
          (cd apps/server && npx eslint . && npx tsc --noEmit && bash ./scripts/d1-smoke-test.sh && npx tsx scripts/d1-integration-test.ts)
          npm test
          npm run build --workspace=apps/dashboard
          npm run build --workspace=apps/portal
      - name: Build the Worker artifact without uploading it
        if: env.TOCYN_OPERATION != 'rollback'
        run: npx wrangler deploy --dry-run --outdir "$TOCYN_RELEASE_DIR/worker" --metafile "$TOCYN_RELEASE_DIR/worker-meta.json" --config "$TOCYN_RELEASE_DIR/wrangler.source.json"
      - name: Bind provenance to the checked release revision
        if: env.TOCYN_OPERATION != 'rollback'
        run: node scripts/deployment/isolated-release.mjs package --target preview --revision "$TOCYN_REVISION" --mode "$TOCYN_RELEASE_MODE" --output "$TOCYN_RELEASE_DIR"
      - name: Validate the deployable immutable artifact
        if: env.TOCYN_OPERATION != 'rollback'
        run: npx wrangler deploy --dry-run --no-bundle --config "$TOCYN_RELEASE_DIR/wrangler.deploy.json"
      - name: Download the protected known-good artifact for rollback
        if: env.TOCYN_OPERATION == 'rollback'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tocyn-preview-${{ vars.TOCYN_KNOWN_GOOD_REVISION }}
          run-id: ${{ vars.TOCYN_KNOWN_GOOD_ARTIFACT_RUN_ID }}
          path: ${{ runner.temp }}/tocyn-known-release
          github-token: ${{ github.token }}
      - name: Select the immutable deploy artifact
        run: |
          if [ "$TOCYN_OPERATION" = 'rollback' ]; then
            echo "TOCYN_DEPLOY_DIR=$RUNNER_TEMP/tocyn-known-release" >> "$GITHUB_ENV"
            echo "TOCYN_DEPLOY_REVISION=$TOCYN_KNOWN_GOOD_REVISION" >> "$GITHUB_ENV"
          else
            echo "TOCYN_DEPLOY_DIR=$TOCYN_RELEASE_DIR" >> "$GITHUB_ENV"
            echo "TOCYN_DEPLOY_REVISION=$TOCYN_REVISION" >> "$GITHUB_ENV"
          fi
      - name: Require the recorded known-good artifact for rollback
        if: env.TOCYN_OPERATION == 'rollback'
        run: node scripts/deployment/verify-rollback.mjs "$TOCYN_DEPLOY_DIR/provenance.json"
      - name: Verify immutable artifact before deployment
        run: node scripts/deployment/verify-release-artifact.mjs "$TOCYN_DEPLOY_DIR" preview
      - name: Read and record exact provider resource bindings
        env:
          TOCYN_RESOURCE_READ_API_TOKEN: ${{ secrets.TOCYN_RESOURCE_READ_API_TOKEN }}
          TOCYN_ACCESS_READ_API_TOKEN: ${{ secrets.TOCYN_ACCESS_READ_API_TOKEN }}
          TOCYN_VERIFY_PROVIDER_RECEIPT: ${{ inputs.operation == 'rollback' && 'true' || 'false' }}
        run: node scripts/deployment/verify-provider-resources.mjs "$TOCYN_DEPLOY_DIR" preview
      - name: Bind provider receipt to a new release artifact
        if: env.TOCYN_OPERATION != 'rollback'
        run: node scripts/deployment/isolated-release.mjs finalize --output "$TOCYN_DEPLOY_DIR"
      - name: Verify final immutable release evidence
        run: node scripts/deployment/verify-release-artifact.mjs "$TOCYN_DEPLOY_DIR" preview
      - name: Confirm required Worker secrets exist without reading values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deployment/verify-worker-secrets.mjs "$TOCYN_DEPLOY_DIR/wrangler.deploy.json"
      - name: Upload the redacted release artifact
        if: env.TOCYN_OPERATION != 'rollback'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tocyn-preview-${{ inputs.revision }}
          path: ${{ runner.temp }}/tocyn-release
          if-no-files-found: error
          retention-days: 30
      - name: Deploy the isolated Worker artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --no-bundle --config "$TOCYN_DEPLOY_DIR/wrangler.deploy.json" --message "tocyn preview $TOCYN_DEPLOY_REVISION"
      - name: Publish protected frontend artifacts and verify ingress
        if: env.TOCYN_RELEASE_MODE == 'rehearse'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deployment/publish-pages.mjs "$TOCYN_DEPLOY_DIR" preview
      - name: Discover and prove Pages aliases are Access-protected
        if: env.TOCYN_RELEASE_MODE == 'rehearse'
        env:
          TOCYN_RESOURCE_READ_API_TOKEN: ${{ secrets.TOCYN_RESOURCE_READ_API_TOKEN }}
          TOCYN_ACCESS_READ_API_TOKEN: ${{ secrets.TOCYN_ACCESS_READ_API_TOKEN }}
        run: node scripts/deployment/verify-pages-ingress-boundaries.mjs "$TOCYN_DEPLOY_DIR" preview "$RUNNER_TEMP/pages-aliases.json"
      - name: Verify protected ingress with the synthetic Access identity
        if: env.TOCYN_RELEASE_MODE == 'rehearse'
        env:
          TOCYN_ACCESS_CLIENT_ID: ${{ secrets.TOCYN_ACCESS_CLIENT_ID }}
          TOCYN_ACCESS_CLIENT_SECRET: ${{ secrets.TOCYN_ACCESS_CLIENT_SECRET }}
        run: node scripts/deployment/verify-restricted-ingress.mjs "$TOCYN_DEPLOY_DIR" preview "$RUNNER_TEMP/pages-aliases.json"

  deploy-beta:
    if: github.ref == 'refs/heads/main' && inputs.target == 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: tocyn-beta
    env:
      TOCYN_OPERATION: ${{ inputs.operation }}
      TOCYN_RELEASE_TARGET: beta
      TOCYN_RELEASE_MODE: ${{ inputs.operation == 'park' && 'park' || 'rehearse' }}
      TOCYN_REVISION: ${{ inputs.revision }}
      TOCYN_RELEASE_DIR: ${{ runner.temp }}/tocyn-release
      TOCYN_D1_DATABASE_ID: ${{ vars.TOCYN_D1_DATABASE_ID }}
      TOCYN_D1_DATABASE_NAME: tocyn-beta-db
      TOCYN_ATTACHMENTS_BUCKET: tocyn-beta-attachments
      TOCYN_PORTAL_ORIGIN: ${{ vars.TOCYN_PORTAL_ORIGIN }}
      TOCYN_DASHBOARD_ORIGIN: ${{ vars.TOCYN_DASHBOARD_ORIGIN }}
      TOCYN_API_ORIGIN: ${{ vars.TOCYN_API_ORIGIN }}
      TOCYN_RESTRICTED_INGRESS_APPROVED: ${{ vars.TOCYN_RESTRICTED_INGRESS_APPROVED }}
      TOCYN_CLOUDFLARE_ACCOUNT_ID: ${{ vars.TOCYN_CLOUDFLARE_ACCOUNT_ID }}
      TOCYN_API_ACCESS_APPLICATION_ID: ${{ vars.TOCYN_API_ACCESS_APPLICATION_ID }}
      TOCYN_PORTAL_ACCESS_APPLICATION_ID: ${{ vars.TOCYN_PORTAL_ACCESS_APPLICATION_ID }}
      TOCYN_DASHBOARD_ACCESS_APPLICATION_ID: ${{ vars.TOCYN_DASHBOARD_ACCESS_APPLICATION_ID }}
      TOCYN_PORTAL_PAGES_ALIAS_ACCESS_APPLICATION_IDS: ${{ vars.TOCYN_PORTAL_PAGES_ALIAS_ACCESS_APPLICATION_IDS }}
      TOCYN_DASHBOARD_PAGES_ALIAS_ACCESS_APPLICATION_IDS: ${{ vars.TOCYN_DASHBOARD_PAGES_ALIAS_ACCESS_APPLICATION_IDS }}
      TOCYN_KNOWN_GOOD_REVISION: ${{ vars.TOCYN_KNOWN_GOOD_REVISION }}
      TOCYN_KNOWN_GOOD_RELEASE_DIGEST: ${{ vars.TOCYN_KNOWN_GOOD_RELEASE_DIGEST }}
      TOCYN_KNOWN_GOOD_ARTIFACT_RUN_ID: ${{ vars.TOCYN_KNOWN_GOOD_ARTIFACT_RUN_ID }}
      VITE_API_URL: ${{ vars.TOCYN_API_ORIGIN }}
    steps:
      - name: Check out trusted main workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
