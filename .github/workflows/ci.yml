name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tocyn / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: python3 docs/planning/post-beta-2026-09-10/test_schedule.py && python3 docs/planning/post-beta-2026-09-10/validate.py && bash scripts/validate-workflows.sh && npm run lint --workspace=apps/portal && cd apps/server && npx eslint .
          - check: typecheck
            command: npm run typecheck:rehearsal-runtime && npm run typecheck --workspace=apps/server && npm run typecheck:local-tenants --workspace=apps/server && npm run typecheck:tenant-isolation-core --workspace=apps/server && npm run typecheck:tenant-isolation-storage-background --workspace=apps/server && npm run typecheck:canonical-conversation --workspace=apps/server && npm run typecheck:canonical-conversation-atomic --workspace=apps/server && npm run typecheck:ticket-mutation-replay --workspace=apps/server && npm run typecheck:conversation-audit --workspace=apps/server && npm run typecheck:local-beta --workspace=apps/server && npm run typecheck:operator-workflow --workspace=apps/server && npm run typecheck:local-portal-workflow --workspace=apps/server && npm run typecheck:operational-performance --workspace=apps/server
          - check: build
            command: npm run build --workspace=apps/dashboard && npm run build --workspace=apps/portal && npm run build --workspace=apps/widget
          - check: test
            command: npm test && npm run test:rehearsal-runtime && TZ=Europe/London npm exec --workspace=apps/dashboard -- vitest run src/__tests__/utcTimestamp.test.ts && cd apps/server && bash ./scripts/d1-smoke-test.sh && npx tsx scripts/d1-integration-test.ts && node scripts/local-auth-smoke.mjs && npx tsx scripts/verify-local-tenant-fixture.ts && npm run test:local-tenants:focused && npm run test:tenant-isolation-core && npm run test:tenant-isolation-storage-background && npm run test:local-tenant-realtime && npm run test:canonical-conversation && npm run test:canonical-conversation-atomic && npm run test:ticket-mutation-replay && npm run test:conversation-audit && npm run test:local-beta && npm run test:local-beta-runtime && npm run test:operator-workflow && npm run test:local-portal-workflow && npm run test:observability-config && npm run test:operational-performance && npm run evidence:operational-performance
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '>=22.12.0 <23'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate
        run: ${{ matrix.command }}
