name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tocyn / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: bash scripts/validate-workflows.sh && npm run lint --workspace=apps/portal && cd apps/server && npx eslint .
          - check: typecheck
            command: npm run typecheck --workspace=apps/server && npm run typecheck:local-tenants --workspace=apps/server
          - check: build
            command: npm run build --workspace=apps/dashboard && npm run build --workspace=apps/portal && npm run build --workspace=apps/widget
          - check: test
            command: npm test && cd apps/server && bash ./scripts/d1-smoke-test.sh && npx tsx scripts/d1-integration-test.ts && node scripts/local-auth-smoke.mjs && npx tsx scripts/verify-local-tenant-fixture.ts && npm run test:local-tenants:focused
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '>=22.12.0 <23'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate
        run: ${{ matrix.command }}
