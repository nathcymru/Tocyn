name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tocyn / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: npm run lint --workspace=apps/portal && cd apps/server && npx eslint .
          - check: typecheck
            command: npm run typecheck --workspace=apps/server
          - check: build
            command: npm run build --workspace=apps/dashboard && npm run build --workspace=apps/portal && npm run build --workspace=apps/widget
          - check: test
            command: npm run test --workspace=apps/server -- --run && npm exec --workspace=apps/portal -- vitest run src/__tests__/VerifyPage.test.tsx src/__tests__/client.test.ts && npm exec --workspace=apps/widget -- vitest run src/__tests__/api.test.ts && cd apps/server && ./scripts/d1-smoke-test.sh && npx tsx scripts/d1-integration-test.ts
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '>=22.12.0 <23'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate
        run: ${{ matrix.command }}
